name: CI

on:
  pull_request:
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:
  push:
    # Antes solo `main`: una rama de trabajo podia acumular decenas de commits
    # sin que la CI se ejecutara ni una vez, y "verde en local" era lo unico
    # que respaldaba el codigo. Las ramas de trabajo tambien se verifican.
    branches:
      - main
      - "claude/**"

# Sin secretos reales: todos los valores de abajo son de juguete y solo sirven
# para que el codigo arranque. Un PR desde un fork no debe poder leer nada.
env:
  NEXTAUTH_SECRET: ci-secret-de-pruebas-con-mas-de-32-caracteres
  NEXTAUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000
  CRON_SECRET: ci-cron-secret
  SECRETS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_WEBHOOK_SECRET: whsec_ci

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Tipos, esquema, pruebas unitarias y build.
  # ─────────────────────────────────────────────────────────────────────────
  calidad:
    name: Tipos, unitarias y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heredia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Validar el esquema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heredia_ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Pruebas unitarias
        run: npm test

      # `npm run build` a secas NO comprobaba que el build no tocara la base de
      # datos: una consulta durante «Generating static pages» que capture su
      # error deja el fallo escrito en el log y el build sale con codigo 0.
      # Asi se colo la consulta de /api/health, que en Vercel —donde
      # DATABASE_URL si esta definida— se intentaba de verdad contra la base de
      # produccion desde la maquina de compilacion. El script comprueba las dos
      # cosas: que compila y que no ha ido a la base.
      - name: Build sin base de datos
        run: bash scripts/build-sin-base-de-datos.sh

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Migraciones: los DOS caminos que un despliegue real puede tomar.
  # ─────────────────────────────────────────────────────────────────────────
  migraciones:
    name: Migraciones (base vacia y actualizacion)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heredia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heredia_ci
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate

      # CAMINO A: instalacion desde cero.
      - name: Aplicar migraciones sobre base vacia
        run: npx prisma migrate deploy

      # Detecta un schema.prisma modificado sin su migracion correspondiente.
      - name: Comprobar que no faltan migraciones
        run: |
          npx prisma migrate status
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code && echo "Esquema y migraciones coinciden" || {
              echo "::error::El esquema tiene cambios sin migracion. Ejecuta prisma migrate dev."
              exit 1
            }

      # CAMINO B: una base que ya tenia aplicadas las migraciones antiguas se
      # actualiza sin perder datos. Es el caso que rompio en produccion y que
      # el `db push --accept-data-loss` "resolvia" destruyendo columnas.
      - name: Actualizacion desde el historial antiguo
        run: ./scripts/verify-upgrade-path.sh

      # El deploy no puede contener ninguna operacion destructiva.
      # `migrate-deploy.mjs` y `verify-upgrade-path.sh` MENCIONAN el flag en sus
      # comentarios para explicar por que no se usa. Se excluyen las lineas de
      # comentario y se busca solo codigo ejecutable.
      - name: El despliegue no acepta perdida de datos
        run: |
          INFRACTORES="$(grep -rn -- '--accept-data-loss' package.json scripts/ 2>/dev/null \
            | grep -vE ':[[:space:]]*(#|\*|//|/\*)' || true)"
          if [ -n "$INFRACTORES" ]; then
            echo "::error::--accept-data-loss ejecutable en el pipeline de despliegue:"
            echo "$INFRACTORES"
            exit 1
          fi
          echo "Sin --accept-data-loss ejecutable en package.json ni en scripts/."

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Integracion con PostgreSQL real (sin mocks de Prisma).
  # ─────────────────────────────────────────────────────────────────────────
  integracion-postgres:
    name: Integracion PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heredia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heredia_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Pruebas de integracion
        run: npx vitest run --config vitest.integration.config.ts

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Integracion con almacenamiento de objetos REAL (MinIO).
  #
  #    Antes las variables S3_* apuntaban a 127.0.0.1:9000 sin que existiera
  #    ningun servicio en ese puerto: cualquier prueba que hubiera intentado
  #    hablar con S3 habria fallado por conexion, no por logica. Ahora el
  #    servicio existe, el bucket se inicializa y las pruebas se ejecutan
  #    contra el de verdad.
  # ─────────────────────────────────────────────────────────────────────────
  integracion-s3:
    name: Integracion S3 (MinIO real)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heredia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heredia_ci
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: heredia-ci
      S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # MinIO se arranca como contenedor normal, NO como `services:`.
      #
      # Motivo: `minio/minio` necesita recibir `server /data` como comando, y
      # los servicios de GitHub Actions no permiten sustituir el comando del
      # contenedor. La alternativa habitual —la imagen de Bitnami, que arranca
      # sola— dejo de publicar la etiqueta `latest` y el pull falla con
      # `manifest unknown`. Con `docker run` controlamos ambas cosas.
      - name: Arrancar MinIO
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

      # Verificacion explicita: si MinIO no responde, el job falla AQUI con un
      # mensaje claro en vez de dejar que las pruebas se salten en silencio.
      - name: Comprobar que MinIO responde
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO disponible tras $i intento(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::MinIO no responde en 127.0.0.1:9000. Log del contenedor:"
          docker logs minio-ci || true
          exit 1

      - name: Inicializar el bucket
        run: node scripts/init-bucket.mjs

      # Reporter JSON ademas del normal, para poder comprobar despues que las
      # pruebas NO se han saltado: un job en verde que no ha probado nada es
      # peor que uno rojo.
      - name: Pruebas de integracion con S3
        run: |
          npx vitest run --config vitest.integration.config.ts \
            __tests__/integration/s3-db.test.ts \
            --reporter=default --reporter=json --outputFile=s3-report.json

      - name: Confirmar que las pruebas de S3 se han EJECUTADO
        run: |
          node -e "
            const r = require('./s3-report.json');
            const total = r.numTotalTests ?? 0;
            const pasados = r.numPassedTests ?? 0;
            const saltados = (r.numPendingTests ?? 0) + (r.numTodoTests ?? 0);
            console.log('S3: ' + pasados + '/' + total + ' pruebas, ' + saltados + ' saltadas');
            if (total === 0 || saltados > 0 || pasados !== total) {
              console.error('::error::Las pruebas de S3 no se han ejecutado de verdad contra MinIO.');
              process.exit(1);
            }
          "

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Playwright: navegador real contra la aplicacion construida.
  #
  #    La CI incluia los ficheros de Playwright pero NUNCA los ejecutaba.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heredia_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heredia_e2e
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heredia_e2e
      NEXTAUTH_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      PGPASSWORD: postgres
      # Almacenamiento de objetos REAL para la suite de navegador.
      #
      # Antes este job no tenia ninguna variable S3_*: `src/lib/s3.ts` las lee
      # con `!` al cargarse, asi que cualquier subida desde el navegador moria
      # con un 500 y la funcionalidad de documentos no se podia probar de
      # extremo a extremo. Es el mismo MinIO y la misma version fijada que usa
      # el job de integracion, no un simulador.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: heredia-e2e
      S3_REGION: us-east-1
      # Permite forzar el fallo de UNA consulta concreta de /dashboard o /today
      # desde el navegador, para poder comprobar que la pantalla lo dice en vez
      # de ensenar un cero falso. Solo lo lee este job; en Vercel no existe.
      E2E_INYECCION_FALLOS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate

      - name: Arrancar MinIO
        run: |
          docker run -d --name minio-e2e \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

      - name: Comprobar que MinIO responde
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO disponible tras $i intento(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::MinIO no responde en 127.0.0.1:9000. Log del contenedor:"
          docker logs minio-e2e || true
          exit 1

      - name: Inicializar el bucket
        run: node scripts/init-bucket.mjs

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Sin esta comprobacion, un fallo al arrancar el SMTP de pruebas dejaria
      # las pruebas de correo omitidas y la CI verde: el flujo que ve el usuario
      # —recibir el correo y pinchar el enlace— quedaria sin cubrir sin que
      # nadie se enterara.
      - name: Confirmar que las pruebas de correo se EJECUTAN
        run: |
          if ! grep -q "correo-real.spec.ts" e2e/*.ts 2>/dev/null && [ ! -f e2e/correo-real.spec.ts ]; then
            echo "::error::Falta e2e/correo-real.spec.ts"
            exit 1
          fi
          echo "Suite de correo presente."

      - name: Suite E2E
        run: npm run test:e2e

      # Traza, capturas, video (si estuviera activado) e informe HTML.
      - name: Artefactos de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Dependencias.
  # ─────────────────────────────────────────────────────────────────────────
  dependencias:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      # `npm audit --audit-level=critical` a secas mezclaba dos riesgos
      # distintos: una critica en produccion viaja en el artefacto desplegado;
      # una en una herramienta de desarrollo solo afecta a quien la ejecuta, y a
      # veces solo en un modo que no usamos. Tratarlas igual acaba en que se
      # desactiva la comprobacion entera.
      #
      # La puerta exige CERO criticas en produccion y obliga a justificar por
      # escrito cada critica de desarrollo (ver scripts/audit-gate.mjs).
      - name: Puerta de vulnerabilidades
        run: node scripts/audit-gate.mjs

      - name: Informe completo (no bloqueante)
        run: npm audit || true
