# Crons que no caben en el plan Hobby de Vercel.
#
# POR QUE EXISTE ESTE FICHERO
# ----------------------------
# El plan Hobby de Vercel solo admite crons de frecuencia diaria. Mientras
# `vercel.json` declaraba uno cada 10 minutos, Vercel RECHAZABA el despliegue
# entero antes de compilar: el estado «Deployment failed.» llegaba 0-2 segundos
# despues del push, cuando el build de este proyecto tarda entre 70 y 90.
#
# No es que ese proceso fuera prescindible: la recuperacion de cobros de Stripe
# es lo que reintenta los pagos fallidos antes de que una suscripcion se cancele
# sola. Bajarla a una vez al dia alarga hasta 24 horas la ventana en la que un
# cobro recuperable se queda sin reintentar.
#
# Asi que el proceso conserva su frecuencia y cambia de disparador: sale de
# `vercel.json` y entra aqui.
#
# EL SECRETO NO ESTA EN EL REPOSITORIO
# -------------------------------------
# `CRON_SECRET` se lee de los secretos de Actions y viaja en la cabecera
# `Authorization`, nunca como parametro de consulta: los parametros acaban en
# los registros del servidor y del proxy, las cabeceras no.
#
# TRES LIMITACIONES QUE HAY QUE CONOCER
# --------------------------------------
# 1. Este fichero NO HACE NADA hasta que llegue a `main`. GitHub solo ejecuta
#    `schedule` desde la rama por defecto, y `workflow_dispatch` tampoco sirve
#    de escape: el boton «Run workflow» solo aparece cuando el workflow existe
#    en la rama por defecto. Mientras viva solo en una rama de trabajo no puede
#    dispararse ni solo ni a mano.
#
# 2. GitHub no garantiza la puntualidad de `schedule`: en horas de mucha carga
#    los disparos se retrasan, y a veces se saltan. Por eso el horario evita el
#    minuto en punto. Para un reintento de cobro es aceptable —el siguiente
#    disparo recoge lo que quedo pendiente—, pero no debe usarse este mecanismo
#    para nada que exija puntualidad estricta.
#
# 3. En repositorios publicos, GitHub DESACTIVA los workflows programados tras
#    60 dias sin actividad en el repositorio, y avisa por correo al propietario.
#    Un repositorio que se queda quieto dos meses deja de reintentar cobros sin
#    que nada falle a la vista. Por eso `vercel.json` conserva una ejecucion
#    diaria de respaldo: aunque GitHub se apague, el proceso sigue corriendo una
#    vez al dia. Se reactiva desde la pestana Actions.
name: Crons frecuentes

on:
  schedule:
    # Cada 10 minutos, la misma frecuencia que tenia en `vercel.json` antes de
    # que Hobby la rechazara, pero DESPLAZADA fuera del minuto en punto.
    #
    # El minuto 0 es donde se acumulan casi todos los `schedule` del mundo, y
    # es justo cuando GitHub mas retrasa o descarta disparos. En los minutos
    # 3, 13, 23... la cola esta mucho mas vacia.
    - cron: "3-59/10 * * * *"
  # Para dispararlo a mano sin esperar al turno.
  workflow_dispatch:

# Este workflow no lee ni escribe nada del repositorio: solo hace una peticion
# HTTP saliente. Sin permisos, el GITHUB_TOKEN que recibe no sirve para tocar
# codigo, incidencias ni releases aunque algo saliera mal.
permissions: {}

# Un disparo cada 10 minutos con una ejecucion que se alargue produciria dos
# procesos solapados sobre los mismos cobros. Se deja terminar al que ya corre.
concurrency:
  group: crons-frecuentes
  cancel-in-progress: false

jobs:
  disparar:
    name: Disparar cron
    runs-on: ubuntu-latest
    # Un fork no debe poder lanzar procesos contra la aplicacion de produccion.
    if: github.repository == 'VERIFACTUREADY/regusentinel-site'
    # El peor caso del `curl` de abajo son tres intentos de 120 s mas dos
    # esperas de 10, algo menos de 7 minutos. Con 10 el job se corta antes de
    # solaparse con el disparo siguiente, que llega a los 10.
    timeout-minutes: 10
    steps:
      - name: Comprobar la configuracion
        env:
          BASE: ${{ vars.APP_URL }}
          SECRETO: ${{ secrets.CRON_SECRET }}
        run: |
          # Sin esta comprobacion, una variable mal puesta produce un 401
          # silencioso y el proceso deja de ejecutarse sin que nadie se entere.
          # Un cron que falla en silencio es peor que uno que no existe.
          faltan=""
          [ -n "$BASE" ]    || faltan="$faltan APP_URL(variable)"
          [ -n "$SECRETO" ] || faltan="$faltan CRON_SECRET(secreto)"
          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en este repositorio:$faltan"
            echo "APP_URL va en Settings > Secrets and variables > Actions > Variables."
            echo "CRON_SECRET va en la pestana Secrets, y debe coincidir con el de Vercel."
            exit 1
          fi

      - name: Llamar al endpoint
        env:
          BASE: ${{ vars.APP_URL }}
          SECRETO: ${{ secrets.CRON_SECRET }}
          RUTA: /api/cron/stripe-recovery
        run: |
          set -uo pipefail
          URL="${BASE%/}$RUTA"
          echo "Disparando $RUTA"

          # El secreto viaja en la cabecera, no en la URL: los parametros de
          # consulta acaban en los registros de acceso, las cabeceras no.
          # `-sS` calla la barra de progreso pero deja pasar los errores.
          #
          # La respuesta se descarta. Los registros de Actions de un repositorio
          # publico los lee cualquiera, y el cuerpo de un endpoint de cobros
          # puede traer importes, identificadores de cliente o mensajes de error
          # de Stripe. La ruta y el codigo HTTP bastan para saber si ha ido bien;
          # el detalle esta en los registros del servidor, donde corresponde.
          CODIGO=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 10 --retry-connrefused \
            -H "Authorization: Bearer $SECRETO" \
            "$URL") || CODIGO="000"

          echo "HTTP $CODIGO"

          case "$CODIGO" in
            2*)   echo "Correcto." ;;
            401|403)
              echo "::error::$RUTA ha respondido $CODIGO. El CRON_SECRET de este repositorio no coincide con el de la aplicacion."
              exit 1 ;;
            000)
              echo "::error::No se ha podido contactar con $URL. Revisa APP_URL y que el despliegue este vivo."
              exit 1 ;;
            *)
              echo "::error::$RUTA ha respondido $CODIGO."
              exit 1 ;;
          esac
